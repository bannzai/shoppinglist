appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 設定タブに切り替え（NavigationBarの2番目のタブ）
- tapOn:
    text: "設定.*"
    index: 0
- assertVisible: "設定.*"
- takeScreenshot: screenshots/settings_01_initial

# 表示名を入力
- tapOn: "表示名を入力"
- inputText: "テストユーザー"
# 保存ボタンは廃止。キーボードの完了キーでフォーカスが外れ、その時に自動保存される。
# （背景タップでは Flutter は unfocus しないため、enter で明示的にフォーカスを外す）
- pressKey: enter
- waitForAnimationToEnd
# フォーカス喪失で自動保存が走り、成功 SnackBar が表示されることを確認する
- assertVisible: "表示名を更新しました"
- takeScreenshot: screenshots/settings_02_name_saved

# グループ管理画面に遷移（設定からのナビゲーション確認）
- tapOn: "グループ管理"
- assertVisible: "グループ管理"
- takeScreenshot: screenshots/settings_03_group_list

# NOTE: グループ作成の検証は専用フロー（group_creation_limit_non_premium.yaml /
#       premium_group_creation.yaml）に分離している。この設定フローでは
#       プロフィール（表示名の自動保存）＋設定ナビゲーションの確認に集中する。

# 設定画面へ戻る
- pressKey: back
