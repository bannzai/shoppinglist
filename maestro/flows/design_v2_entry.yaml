appId: ${APP_ID}
---
# Onboarding 3 スライド + Auth 文言 SSOT 化 (PR-2) の検証。
# - Onboarding body は screens-onboarding.jsx exact 文に差し替え済み
# - Auth title / body / 規約注記 は screens-onboarding.jsx#AuthPage 準拠
# - Auth ゲスト開始ボタン「サインインせずにはじめる」は release でも常時表示 (issue #548)
#
# 注意: スライドのタイトル/本文は複数行が 1 つの Text(semantics) に結合されることがあり、
# maestro の text は全文アンカーマッチのため (?s) 部分一致で指定する。

# clearState だけでは Firebase 認証が Keychain に残存しオンボーディングが表示されないため
# clearKeychain も行って未認証状態に戻す（onboarding は未認証ユーザーにのみ表示される）。
- launchApp:
    clearState: true
    clearKeychain: true

# clearState 直後は通知許可ダイアログがオンボーディングの前面に出るため先に閉じる
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd

# Slide 1（スプラッシュ表示後に描画されるため明示的に待つ）
- extendedWaitUntil:
    visible: "(?s).*家族と作る.*"
    timeout: 90000
- assertVisible: "(?s).*家族と作る.*"
- assertVisible: "(?s).*買い物リスト.*"
- assertVisible: "(?s).*店頭で別の誰かがチェック.*"
- swipe:
    direction: LEFT

# Slide 2（最終スライド）
# Slide 3 (店舗近接通知の訴求) は位置情報リマインダー非表示中 (issue #465) のため
# 表示されない (lib/features/onboarding/page.dart の shoppingLocationFeatureEnabled 分岐)。
- assertVisible: "(?s).*同じリストを.*"
- assertVisible: "(?s).*同時に編集.*"
- assertVisible: "(?s).*招待コードで招くと.*"

# 最終スライドの「はじめる」で完走し AuthPage に遷移
- tapOn: "はじめる"

# Auth title / body
- assertVisible: "(?s).*家族の買い物を.*"
- assertVisible: "(?s).*ひとつのリストへ.*"
- assertVisible: "(?s).*広告もメールマガジンもありません.*"

# Auth ゲスト開始ボタンは常時表示 (issue #548: ストア審査がサインインなしで本体へ入るため)
- assertVisible: "サインインせずにはじめる"
- assertVisible: "(?s).*あとから設定画面でアカウントをリンクできます.*"

# サインインボタンは存在。Apple は native SignInWithAppleButton で文言が OS ロケール依存の
# ため maestro の text 一致に向かない。カスタムボタンの「Google でサインイン」存在で
# AuthPage 到達を確認する。
- assertVisible: "(?s).*Google でサインイン.*"

# 規約注記は SSOT 文
- assertVisible: "(?s).*続けることで.*"
- assertVisible: "(?s).*利用規約.*"
- assertVisible: "(?s).*プライバシーポリシー.*"
- assertVisible: "(?s).*に同意したものとみなされます.*"
