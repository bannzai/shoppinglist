appId: com.bannzai.shoppinglist
---
# monthly パッケージ購入 E2E。
# 購入成功後に設定画面の「プレミアム会員」subtitle が「有効」になっていることを確認する。

- runFlow: shared/anonymous_sign_in.yaml

- runFlow: shared/mock_purchase.yaml

# 設定画面に戻って premium 状態を確認。
# 購入完了後の SnackBar や PaywallPage pop の遷移直後はアクセシビリティツリーが
# 安定していない場合があるため extendedWaitUntil で待機する。
- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*プレミアム会員.*"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*有効.*"
    timeout: 15000

- takeScreenshot: screenshots/iap_purchase_monthly_completed
