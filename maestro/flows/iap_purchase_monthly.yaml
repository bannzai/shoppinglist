appId: com.bannzai.shoppinglist
---
# monthly パッケージ購入 E2E。
# 購入成功後に設定画面の「プレミアム会員」subtitle が「有効」になっていることを確認する。

- runFlow: shared/anonymous_sign_in.yaml

- runFlow: shared/mock_purchase.yaml

# 購入完了後、PaywallPage が pop して設定画面に戻る。プレミアムカードが
# 加入済み表示（title "プレミアム会員"）に変わっていることを確認する。
# design v2 の premium カードは title+subtitle が結合されるため (?s) 部分一致で待つ。
# （旧フローの ".*有効.*" は現行に存在しないため削除）
- extendedWaitUntil:
    visible: "(?s).*プレミアム会員.*"
    timeout: 15000

- takeScreenshot: screenshots/iap_purchase_monthly_completed
