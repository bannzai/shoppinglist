appId: ${APP_ID}
---
# プレミアム状態では 2 個目以降のグループも作成できることを確認する。
# non_premium 版では「ソログループ+1グループまで」の SnackBar で遮断される。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# 設定 → グループ管理（grant_premium_via_debug.yaml 終了時点で設定画面の下方にいるため
# UP 方向にスクロールしてグループ管理 ListTile まで戻す）
- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "グループ管理"
    direction: UP
    timeout: 30000
- tapOn: "グループ管理"
- waitForAnimationToEnd

# 2 個目のグループを作成
- tapOn: "グループ作成"
- waitForAnimationToEnd
- tapOn: "グループ名"
- inputText: "Extra Group"
# `text: "作成"` の regex だと AppBar の「グループ作成」(index 0) もマッチしてしまうため、
# 「作成する」ボタン本体を完全一致で指定する。
- tapOn: "作成する"
- waitForAnimationToEnd

# non_premium 時の SnackBar が出ないこと
- assertNotVisible: "無料プランではソログループ\\+1グループまで作成できます"

- takeScreenshot: screenshots/premium_group_creation_unlocked
