appId: ${APP_ID}
---
# Phase 2: デバッグユーザー作成
- launchApp:
    clearState: false

# 設定タブ → 開発者オプション画面へ遷移
- runFlow: ../shared/open_developer_options.yaml
- extendedWaitUntil:
    visible: "デバッグユーザー作成"
    timeout: 10000
- tapOn: "デバッグユーザー作成"

# 操作完了を待つ
- extendedWaitUntil:
    visible: ".*完了"
    timeout: 15000

# 開発者オプションページから戻る
- tapOn: "Back"
- waitForAnimationToEnd

# 買い物リストタブに戻る
- tapOn:
    point: "25%,93%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 10000
- takeScreenshot: screenshots/virtual_pairing/02_debug_user_created
