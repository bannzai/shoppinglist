appId: ${APP_ID}
---
# Phase 4: デバッグユーザーとしてアイテム追加
- launchApp:
    clearState: false

# 設定タブ → 開発者オプション画面へ遷移
- runFlow: ../shared/open_developer_options.yaml

# デフォルトのアイテムメッセージ "debug_item_test" をそのまま使用

# アイテム追加ボタンをタップ（下部タイルのためスクロールで探す）
- scrollUntilVisible:
    element:
      text: "デバッグユーザーとしてアイテム追加"
    direction: DOWN
    timeout: 15000
- tapOn: "デバッグユーザーとしてアイテム追加"

# 結果メッセージ "<action> 完了" は開発者オプション上部に出る。下スクロール済みのため
# 上方向にスクロールして完了を確認する。
- scrollUntilVisible:
    element:
      text: ".*完了"
    direction: UP
    timeout: 15000

# 開発者オプションページから戻る
- tapOn: "Back"
- waitForAnimationToEnd
- takeScreenshot: screenshots/virtual_pairing/04_item_added
