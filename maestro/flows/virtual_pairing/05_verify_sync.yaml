appId: ${APP_ID}
---
# Phase 5: リアルタイム同期確認（核心テスト）
# launchApp で home（デフォルトグループ）に戻る。design v2 にボトムタブは無いため
# タブ切替は不要。デバッグユーザーが追加した "debug_item_test" が Firestore の
# リアルタイム同期で表示されることを確認する。
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "debug_item_test"
    timeout: 15000
- takeScreenshot: screenshots/virtual_pairing/05_item_synced
