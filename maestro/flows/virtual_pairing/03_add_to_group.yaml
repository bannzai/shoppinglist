appId: com.bannzai.shoppinglist
---
# Phase 3: グループにデバッグユーザー追加
- launchApp:
    clearState: false

# 設定タブに切り替え
- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd

# 開発者オプションは設定画面最下部にあるので十分にスクロール
- swipe:
    start: "50%,80%"
    end: "50%,20%"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
- tapOn: "開発者オプション"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "グループにデバッグユーザーを追加"
    timeout: 10000
- tapOn: "グループにデバッグユーザーを追加"

# 操作完了を待つ
- extendedWaitUntil:
    visible: ".*完了"
    timeout: 15000

# 開発者オプションページから戻る
- tapOn: "Back"
- waitForAnimationToEnd

# 買い物リストタブに戻る
- tapOn:
    point: "25%,93%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 10000
- takeScreenshot: screenshots/virtual_pairing/03_debug_user_added
