appId: com.bannzai.shoppinglist
---
# Phase 3: グループにデバッグユーザー追加
- launchApp:
    clearState: false

# 設定タブ → 開発者オプション画面へ遷移
- runFlow: ../shared/open_developer_options.yaml
- scrollUntilVisible:
    element:
      text: "グループにデバッグユーザーを追加"
    direction: DOWN
    timeout: 15000
- tapOn: "グループにデバッグユーザーを追加"

# 結果メッセージ "<action> 完了" は開発者オプション上部に出る。下スクロール済みのため
# 上方向にスクロールして完了を確認する。
- scrollUntilVisible:
    element:
      text: ".*完了"
    direction: UP
    timeout: 15000

# 開発者オプション → 設定 → home へ戻る（design v2 にボトムタブは無い）
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn:
    point: "7%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 10000
- takeScreenshot: screenshots/virtual_pairing/03_debug_user_added
