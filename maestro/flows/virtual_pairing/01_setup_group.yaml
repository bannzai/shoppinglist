appId: ${APP_ID}
---
# Phase 1: サインイン（design v2 ナビ追従）。
#
# 仮想ペアリングのデバッグ Function（developer_options/page.dart）は、グループ追加・
# アイテム追加・クリーンアップとも全て defaultGroupID（サインイン時に自動作成される
# ソログループ）を対象にする。さらにアクティブグループは launchApp ごとに
# defaultGroupID へリセットされる（CurrentGroupID.build() => null）。
# そのため別グループの作成・切替は不要で、デフォルトグループ上でデバッグユーザーを
# 追加して同期を検証する。サインインでデフォルトグループと初期リストが用意される。
- runFlow: ../shared/anonymous_sign_in.yaml
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000
- takeScreenshot: screenshots/virtual_pairing/01_signed_in
