appId: com.bannzai.shoppinglist
---
# Phase 1: サインイン + グループ作成
- runFlow: ../shared/anonymous_sign_in.yaml

# 設定タブに切り替え
- tapOn:
    text: "設定.*"
    index: 0

# グループ管理画面に遷移
- tapOn: "グループ管理"

# グループ作成
- tapOn: "グループ作成"
- tapOn: "グループ名を入力"
- inputText: "VirtualPairTestGroup"
- tapOn:
    point: "50%,6%"
- tapOn: "作成する"
- waitForAnimationToEnd

# グループ作成後 pop でグループ管理に戻る。AppBarの戻るボタンで設定ルートへ
# iOS Simulator では pressKey: back が効かないため tapOn: "Back" を使う
- tapOn: "Back"
- waitForAnimationToEnd

# 買い物リストタブに切り替え（NavigationBarのアイコン位置をタップ）
- tapOn:
    point: "25%,93%"
- waitForAnimationToEnd

# GroupSwitcherにVirtualPairTestGroupが表示されるまで待機
- extendedWaitUntil:
    visible: ".*VirtualPair.*"
    timeout: 15000
- tapOn:
    text: ".*VirtualPair.*"
    index: 0
- waitForAnimationToEnd

# shoppingList自動作成待ち
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 15000
- takeScreenshot: screenshots/virtual_pairing/01_group_created
