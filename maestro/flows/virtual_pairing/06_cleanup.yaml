appId: com.bannzai.shoppinglist
---
# Phase 6: クリーンアップ
- launchApp:
    clearState: false

# 設定タブ → 開発者オプション画面へ遷移
- runFlow: ../shared/open_developer_options.yaml
- scrollUntilVisible:
    element:
      text: "デバッグデータクリーンアップ"
    direction: DOWN
    timeout: 15000
- tapOn: "デバッグデータクリーンアップ"

# 結果メッセージ "<action> 完了" は開発者オプション上部に出る。下スクロール済みのため
# 上方向にスクロールして完了を確認する。
- scrollUntilVisible:
    element:
      text: ".*完了"
    direction: UP
    timeout: 15000
- takeScreenshot: screenshots/virtual_pairing/06_cleanup_done
