appId: ${APP_ID}
---
# 非プレミアムユーザーのカテゴリ・ロケーション別並び替え制限テスト（design v2 ナビ追従）。
# 匿名ログイン（非プレミアム）で買い物場所とカテゴリを作成し、リストに場所を割り当てても
# ロケーション別ソートは無効化され、デフォルト order 順（野菜=0, 肉=1 → 野菜が先）で
# 表示されることを確認する。
# design v2 では場所/カテゴリ追加は別画面に分離（category_location_order.yaml と同じナビ）。
- runFlow: ../shared/anonymous_sign_in.yaml

# === Phase 1: リスト設定 → グループ設定 配下で 場所 + カテゴリ2件 を作成 ===
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
- scrollUntilVisible:
    element: "グループ設定"
    direction: DOWN
- tapOn: "グループ設定"
- assertVisible: "グループ設定"

# 買い物場所「テストスーパー」を作成
- scrollUntilVisible:
    element: "(?s).*買い物する場所.*"
    direction: DOWN
- tapOn: "(?s).*買い物する場所.*"
- assertVisible: "買い物する場所がまだありません"
- tapOn:
    point: "90%,93%"
- assertVisible: "場所を追加"
- tapOn: "場所の名前（例: スーパー）"
- inputText: "テストスーパー"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "テストスーパー"
# グループ設定へ戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ画面へ（グループ設定のカテゴリセル → GroupCategoryPage）
- scrollUntilVisible:
    element: "(?s).*カテゴリ.*"
    direction: DOWN
- tapOn: "(?s).*カテゴリ.*"
- assertVisible: "カテゴリを追加"

# カテゴリ1: 野菜 / キーワード にんじん
- tapOn: "カテゴリを追加"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "野菜"
- pressKey: enter
- waitForAnimationToEnd
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "にんじん"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*野菜.*"
    timeout: 10000

# カテゴリ2: 肉 / キーワード 鶏肉（右下 FAB から追加）
- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "肉"
- pressKey: enter
- waitForAnimationToEnd
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "鶏肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 10000
- takeScreenshot: screenshots/cat_loc_non_premium_01_setup_done

# === Phase 2: home に戻る ===
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 30000

# === Phase 3: リストに「テストスーパー」を割り当て ===
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
- tapOn: "(?s).*未設定.*"
- assertVisible: "買い物する場所を選ぶ"
- tapOn: "テストスーパー"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"
# リスト設定(モーダル)を×で閉じる（実測 bounds [4,91][52,139] = 中心 ~7%,13%）
- tapOn:
    point: "7%,13%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000

# === Phase 4: アイテム追加 → デフォルト order で分類確認 ===
- tapOn: "タップで入力開始"
- inputText: "にんじん"
- pressKey: enter
- inputText: "鶏肉"
- pressKey: enter
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd
# 非プレミアムなのでロケーション別ソートは無効化され、デフォルト order 順
# （野菜=0, 肉=1）で表示される。両ヘッダーが出ることを確認し、順序はスクショで目視確認する。
- extendedWaitUntil:
    visible: "(?s).*野菜.*"
    timeout: 10000
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 5000
- takeScreenshot: screenshots/cat_loc_non_premium_02_default_order
