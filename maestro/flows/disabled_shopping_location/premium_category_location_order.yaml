appId: ${APP_ID}
---
# プレミアム状態でロケーション別カテゴリ並び替えが機能することを確認する（design v2 ナビ追従）。
# 「テストスーパー」に対して「肉」(order=0)→「野菜」(order=1) の順序をデバッグ Function 経由で設定し、
# 買い物リスト画面でデフォルト order（野菜=0, 肉=1）の逆順（肉→野菜）で表示されることを確認する。
- runFlow: ../shared/anonymous_sign_in.yaml
- runFlow: ../shared/grant_premium_via_debug.yaml

# === Phase 1: 場所「テストスーパー」とカテゴリ「野菜」「肉」を作成 ===
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
- scrollUntilVisible:
    element: "グループ設定"
    direction: DOWN
- tapOn: "グループ設定"
- assertVisible: "グループ設定"

# 買い物場所「テストスーパー」
- scrollUntilVisible:
    element: "(?s).*買い物する場所.*"
    direction: DOWN
- tapOn: "(?s).*買い物する場所.*"
- assertVisible: "買い物する場所がまだありません"
- tapOn:
    point: "90%,93%"
- assertVisible: "場所を追加"
- tapOn: "場所の名前（例: スーパー）"
- inputText: "テストスーパー"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "テストスーパー"
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ画面へ
- scrollUntilVisible:
    element: "(?s).*カテゴリ.*"
    direction: DOWN
- tapOn: "(?s).*カテゴリ.*"
- assertVisible: "カテゴリを追加"

# カテゴリ1: 野菜 / にんじん
- tapOn: "カテゴリを追加"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "野菜"
- pressKey: enter
- waitForAnimationToEnd
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "にんじん"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*野菜.*"
    timeout: 10000

# カテゴリ2: 肉 / 鶏肉
- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "肉"
- pressKey: enter
- waitForAnimationToEnd
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "鶏肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 10000
- takeScreenshot: screenshots/premium_cat_loc_01_setup_done

# === Phase 2: home に戻る ===
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 30000

# === Phase 3: 開発者オプション経由でカテゴリロケーション順序を設定 ===
# 「肉」= locationOrders[テストスーパー]=0、「野菜」=1（デフォルトの逆順）。
# setupTestCategoryLocationOrder Function が defaultGroupID に対して設定する。
- runFlow: ../shared/open_developer_options.yaml
- extendedWaitUntil:
    visible: "カテゴリロケーション順序設定（テスト用）"
    timeout: 10000
- tapOn: "カテゴリロケーション順序設定（テスト用）"
- extendedWaitUntil:
    visible: "カテゴリロケーション順序設定 完了"
    timeout: 30000
# 開発者オプション → 設定 → home へ戻る（grant_premium_via_debug と同じ復帰手順）
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn:
    point: "7%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000

# === Phase 4: リストに「テストスーパー」を割り当て ===
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
- tapOn: "(?s).*未設定.*"
- assertVisible: "買い物する場所を選ぶ"
- tapOn: "テストスーパー"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"
# リスト設定(モーダル)を×で閉じる（実測 bounds [4,91][52,139] = 中心 ~7%,13%）
- tapOn:
    point: "7%,13%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000

# === Phase 5: アイテム追加 → ロケーション別ソートで 肉→野菜 の逆順表示 ===
- tapOn: "タップで入力開始"
- inputText: "にんじん"
- pressKey: enter
- inputText: "鶏肉"
- pressKey: enter
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# locationOrders: 肉=0, 野菜=1 → 肉が野菜より先（上）に表示される。
# 「肉」ヘッダーが表示され、「野菜」は下方向に存在する（逆順が適用された証跡はスクショ）。
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 10000
- assertVisible: "(?s).*肉.*"
- scrollUntilVisible:
    element: "(?s).*野菜.*"
    direction: DOWN
- assertVisible: "(?s).*野菜.*"
# キーワードマッチが機能し未分類アイテムが無いこと
- assertNotVisible: "未分類"
- takeScreenshot: screenshots/premium_cat_loc_02_location_order_applied
