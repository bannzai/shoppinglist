appId: com.bannzai.shoppinglist
---
# ロケーション別カテゴリのE2Eテスト
# 1. 買い物場所を作成
# 2. カテゴリを3つ作成（キーワード付き）
# 3. 買い物リストにロケーション設定
# 4. アイテム追加＆カテゴリ表示順を確認
# NOTE: GroupCategoryPageへのナビゲーションが未実装のため、ロケーション別並べ替えテストはスキップ

- runFlow: shared/anonymous_sign_in.yaml

# --- 買い物場所の作成 ---

# リスト設定を開く
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
# TextFieldのフォーカスを外す
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd

# グループ設定へ
- tapOn: "グループ設定"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# 場所を追加（グループ設定画面のインラインボタン）
- tapOn: "場所を追加"
- assertVisible: "場所を追加"
- tapOn: "場所の名前（例: スーパー）"
- inputText: "近所のスーパー"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "近所のスーパー"
- takeScreenshot: screenshots/category_location_01_location_created

# --- カテゴリを3つ作成（グループ設定画面から） ---

# カテゴリ1: 野菜
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "野菜"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ名"

# キーワード追加: にんじん
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "にんじん"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ2: 肉
- scrollUntilVisible:
    element: "カテゴリを追加"
    direction: DOWN
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ名"

# キーワード追加: 鶏肉
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "鶏肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ3: 魚
- scrollUntilVisible:
    element: "カテゴリを追加"
    direction: DOWN
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "魚"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ名"

# キーワード追加: サーモン
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "サーモン"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# 3つのカテゴリが作成されたことを確認
# Maestroのアクセシビリティツリー更新のため画面タップ
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_location_02_categories_created

# --- 買い物リストにロケーション設定＆アイテム追加 ---

# リスト設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"

# TextFieldのフォーカスを外す
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd

# 買い物する場所で「近所のスーパー」を選択
- tapOn: "なし"
- waitForAnimationToEnd
- tapOn: "近所のスーパー"
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_location_05_list_location_set

# BottomSheetを閉じる
- tapOn:
    point: "5%,12%"
- waitForAnimationToEnd

# アイテム追加: にんじん（野菜カテゴリ）
- tapOn: "アイテムを追加"
- inputText: "にんじん"
- pressKey: enter

# アイテム追加: 鶏肉（肉カテゴリ）
- inputText: "鶏肉"
- pressKey: enter

# アイテム追加: サーモン（魚カテゴリ）
- inputText: "サーモン"
- pressKey: enter

# 空アイテム削除
- pressKey: enter

# キーボード閉じてフォーカス解除
- tapOn:
    point: "50%,6%"
- waitForAnimationToEnd

# Firestoreデータ同期待ち＆カテゴリヘッダー表示確認
- extendedWaitUntil:
    visible: "野菜"
    timeout: 10000
- extendedWaitUntil:
    visible: "肉"
    timeout: 5000
- extendedWaitUntil:
    visible: "魚"
    timeout: 5000
- takeScreenshot: screenshots/category_location_06_final_categorized
