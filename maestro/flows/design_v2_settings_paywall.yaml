appId: com.bannzai.shoppinglist
---
# Settings & Paywall の検証:
# - 設定画面に確実に到達する（top-bar 設定アイコン tooltip "設定"。home_page_test で実証済み）
# - サインアウト確認ダイアログを開いてキャンセルで閉じられる
# 旧フローは text:"設定" optional がスキップされ「サインアウト」で失敗していた。設定到達を確実化する。

- runFlow: shared/anonymous_sign_in.yaml

# 設定画面へ
- tapOn: "設定"
- extendedWaitUntil:
    visible: "プロフィール"
    timeout: 10000

# サインアウト（設定下部）までスクロールして確認ダイアログを開く
- scrollUntilVisible:
    element:
      text: "サインアウト"
    direction: DOWN
    timeout: 20000
- tapOn: "サインアウト"
- waitForAnimationToEnd
- takeScreenshot: screenshots/settings_paywall_01_signout_dialog

# キャンセルでダイアログを閉じ、設定画面に留まる（サインアウトまでスクロール済みのため
# 上部の「プロフィール」は画面外。現在位置で見える「サインアウト」で設定画面残留を確認）。
- tapOn:
    text: "キャンセル"
- waitForAnimationToEnd
- assertVisible: "サインアウト"
- takeScreenshot: screenshots/settings_paywall_02_back_to_settings
