appId: ${APP_ID}
---
# プレミアム状態では買い物リストの表示期間が無制限になることを確認する。
# リスト設定の「保存期間」セクションの文言が non_premium「作成から30日間」から
# premium「プレミアム: 無制限」に切り替わる（design v2 SSOT 文言）。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# リスト設定を開く（ギアアイコン tooltip→accessibilityText「リスト設定」）
- tapOn: "リスト設定"
- extendedWaitUntil:
    visible: "買い物リスト設定"
    timeout: 8000
# 保存期間セクションは画面下方にあるためスクロールして表示させる
- scrollUntilVisible:
    element:
      text: "保存期間"
    direction: DOWN
    timeout: 15000

# non_premium の文言が消え、premium の文言が表示されていること
- assertNotVisible: "作成から30日間"
- assertVisible: "プレミアム: 無制限"

- takeScreenshot: screenshots/premium_shopping_list_display_period_unlocked
