appId: ${APP_ID}
---
# カテゴリマッチングテスト
# 1. 完全一致: キーワード「牛乳」(完全一致) → 「牛乳」のみマッチ、「牛肉」はマッチしない
# 2. 大文字小文字無視: キーワード「Milk」(部分一致) → 「milk」「MILK」にもマッチ
# 3. 複数カテゴリ: 「牛肉」は乳製品(完全一致 牛乳)に非マッチ、肉(部分一致 牛)にマッチ
#
# design v2 ナビ: リスト設定 →「自動分類のキーワード管理」→ GroupCategoryPage。
# カテゴリ名は onDisappear 保存のため、各カテゴリ作成後に back シェブロンで離脱して確定する。

- runFlow: shared/anonymous_sign_in.yaml

# カテゴリ管理画面（空状態）を開く
- tapOn: "リスト設定"
- waitForAnimationToEnd
- tapOn:
    text: "(?s).*自動分類のキーワード管理.*"
- waitForAnimationToEnd
- assertVisible: "カテゴリを追加"

# --- カテゴリ1: 乳製品（牛乳=完全一致 / Milk=部分一致） ---
- tapOn: "カテゴリを追加"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "乳製品"
- pressKey: enter
- waitForAnimationToEnd

# キーワード1: 牛乳（完全一致）
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "牛乳"
- tapOn: "完全一致"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# キーワード2: Milk（部分一致=デフォルト）
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "Milk"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_matching_01_dairy_keywords

# back シェブロンで離脱して「乳製品」名を確定（onDisappear 保存）
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*乳製品.*"
    timeout: 10000

# --- カテゴリ2: 肉（牛=部分一致）。一覧の「+」FAB から追加 ---
- tapOn:
    point: "90%,93%"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"
- tapOn: "カテゴリ名を入力"
- inputText: "肉"
- pressKey: enter
- waitForAnimationToEnd
- tapOn: "キーワードを追加"
- waitForAnimationToEnd
- inputText: "牛"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
# back シェブロンで離脱して「肉」名を確定
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 10000

# 買い物リスト画面へ戻る（launchApp が多段戻りより安定）
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 30000

# --- アイテム追加してマッチングを検証 ---
- tapOn: "タップで入力開始"
- inputText: "牛乳"
- pressKey: enter
- inputText: "牛肉"
- pressKey: enter
- inputText: "milk"
- pressKey: enter
- inputText: "MILK"
- pressKey: enter
# 空入力行を削除してキーボードを閉じる
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# 乳製品セクション（牛乳/milk/MILK）と 肉セクション（牛肉）が現れる。
# セクションヘッダは結合テキストのため (?s) 部分一致。Firestore 同期待ち。
- extendedWaitUntil:
    visible: "(?s).*乳製品.*"
    timeout: 10000
- extendedWaitUntil:
    visible: "(?s).*肉.*"
    timeout: 5000
- takeScreenshot: screenshots/category_matching_02_result
