appId: com.bannzai.shoppinglist
---
# カテゴリマッチングテスト
# テスト項目:
# 1. 完全一致: キーワード「牛乳」(完全一致) → 「牛乳」のみマッチ、「牛肉」はマッチしない
# 2. 大文字小文字無視: キーワード「Milk」→ 「milk」「MILK」にもマッチ
# 3. 複数カテゴリマッチ時の優先度: リスト順で最初にマッチしたカテゴリに分類

- runFlow: shared/anonymous_sign_in.yaml

# --- セットアップ: カテゴリ2つ作成 ---

# リスト設定 → グループ設定
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd
- tapOn: "グループ設定"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ1: 乳製品（キーワード: 牛乳=完全一致, Milk=部分一致）
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "乳製品"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ名"

# キーワード1: 牛乳（完全一致）
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "牛乳"
- tapOn: "完全一致"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# キーワード2: Milk（部分一致=デフォルト）
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "Milk"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_matching_01_dairy_keywords

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# カテゴリ2: 肉（キーワード: 牛=部分一致）→ 優先度テスト用
- scrollUntilVisible:
    element: "カテゴリを追加"
    direction: DOWN
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ名"

# キーワード: 牛（部分一致）
- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "牛"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd

# リスト設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"

# BottomSheetを閉じる
- tapOn:
    point: "5%,12%"
- waitForAnimationToEnd

# --- テスト1: 完全一致 ---
# 「牛乳」は完全一致で乳製品にマッチ
# 「牛肉」は乳製品の完全一致「牛乳」にはマッチしない。肉の部分一致「牛」にマッチ
- tapOn: "アイテムを追加"
- inputText: "牛乳"
- pressKey: enter
- inputText: "牛肉"
- pressKey: enter

# --- テスト2: 大文字小文字無視 ---
# 「milk」は乳製品の「Milk」(部分一致)にマッチ
# 「MILK」も乳製品の「Milk」(部分一致)にマッチ
- inputText: "milk"
- pressKey: enter
- inputText: "MILK"
- pressKey: enter

# 空アイテム削除
- pressKey: enter

# キーボード閉じてフォーカス解除
- tapOn:
    point: "50%,6%"
- waitForAnimationToEnd

# Firestoreデータ同期待ち
- extendedWaitUntil:
    visible: "乳製品"
    timeout: 10000
- extendedWaitUntil:
    visible: "肉"
    timeout: 5000
- takeScreenshot: screenshots/category_matching_02_result
