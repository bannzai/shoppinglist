appId: com.bannzai.shoppinglist
---
- launchApp:
    clearState: true
    clearKeychain: true
# clearState後に通知許可ダイアログが出るので先に処理する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
# design v2 のオンボーディングをスキップする。clearState 直後は必ず表示されるが、
# 起動直後のスプラッシュ表示中に when:visible が空振りする race を避けるため、
# スキップボタンが出るまで明示的に待ってから tap する。
- extendedWaitUntil:
    visible: "スキップ"
    timeout: 30000
- tapOn: "スキップ"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 90000
- tapOn: "匿名サインイン（デバッグ用）"
# サインイン処理の完了を待機（Retryか成功画面が出るまで待つ）
- waitForAnimationToEnd
# permission-deniedエラーでRetryボタンが表示される場合がある
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
# サインイン後のホーム(買い物リスト)に到達したことを確認する。
# 入力は下部の常設コンポーザー(hint「アイテムを追加...」)に集約され、旧「タップで入力開始」行は廃止。
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 60000
