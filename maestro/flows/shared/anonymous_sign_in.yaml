appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# clearState後に通知許可ダイアログが出るので先に処理する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
# design v2 のオンボーディングをスキップする。clearState 直後は必ず表示されるが、
# 起動直後のスプラッシュ表示中に when:visible が空振りする race を避けるため、
# スキップボタンが出るまで明示的に待ってから tap する。
# timeout はホスト高負荷時(複数 Simulator 並走・ビルド同時実行)に cold start が
# 30 秒を超えて flake するため、後段のサインイン待ちと同じ 90 秒にしている。
- extendedWaitUntil:
    visible: "スキップ"
    timeout: 90000
- tapOn: "スキップ"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 90000
- tapOn: "匿名サインイン（デバッグ用）"
# サインイン処理の完了を待機（Retryか成功画面が出るまで待つ）
- waitForAnimationToEnd
# permission-deniedエラーでRetryボタンが表示される場合がある
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
# 匿名サインイン後はグループ未参加状態のため GroupJoinOrCreatePage が表示される。
# E2E では招待コードを持たないので「自分のリストを作る」でソログループを作成しホームへ進む。
- extendedWaitUntil:
    visible: "自分のリストを作る"
    timeout: 90000
- tapOn: "自分のリストを作る"
- waitForAnimationToEnd
# design v2 の空状態（サインイン後のホーム）に到達したことを確認する
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 60000
