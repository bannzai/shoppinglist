appId: com.bannzai.shoppinglist
---
# monthly パッケージ購入の共通サブフロー。
# 匿名サインイン後に呼び出される前提（shared/anonymous_sign_in.yaml の後段で runFlow）。
#
# NOTE: env による PACKAGE_TYPE 切替は Maestro の idRegex 展開では動作しないため
# monthly 版はここ（shared/mock_purchase.yaml）、annual / lifetime 版は
# shared/mock_purchase_annual.yaml / shared/mock_purchase_lifetime.yaml に分離している。

- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd

# design v2: 設定上部（プロフィール直下）のプレミアムカード。非プレミアム時は
# title "プレミアムにアップグレード" + 「はじめる」pill。カード自体は非タップで、
# 「はじめる」pill が showPaywall を開く（settings/page.dart の _PremiumCard）。
- scrollUntilVisible:
    element:
      text: "はじめる"
    direction: DOWN
    timeout: 15000
- tapOn: "はじめる"
# Paywall（タイトルは "プレミアムにアップグレード"）。RC Offering から 3 プランが
# 読み込まれると "購入" ボタンが出る。読み込み待ちで "購入" 出現を待つ。
- extendedWaitUntil:
    visible: "購入"
    timeout: 15000

# PaywallPage 上の「購入」ボタンは monthly / annual / lifetime の順に並ぶ。
# Flutter Key は iOS accessibility identifier に伝搬しないため、表示順 index で tap する。
- tapOn:
    text: "購入"
    index: 0

# RC Test Store mock purchase modal を承認する。
# モーダルには "Test valid purchase" / "Test failed purchase" / "Cancel" の 3 ボタンが並ぶ。
# 正常購入完遂のため "Test valid purchase" を選ぶ（Issue #237 動作確認時に実機で確認）。
- extendedWaitUntil:
    visible: "Test valid purchase"
    timeout: 30000
- tapOn: "Test valid purchase"

- extendedWaitUntil:
    visible: "購入ありがとうございました"
    timeout: 30000

- takeScreenshot: screenshots/mock_purchase_monthly_completed
