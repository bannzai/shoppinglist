appId: ${APP_ID}
---
# lifetime パッケージ購入の共通サブフロー。shared/mock_purchase_monthly.yaml と同構造。

- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd

# design v2: 設定上部（プロフィール直下）のプレミアムカード。非プレミアム時は
# 「はじめる」pill が showPaywall を開く（カード自体は非タップ）。
- scrollUntilVisible:
    element:
      text: "はじめる"
    direction: DOWN
    timeout: 15000
- tapOn: "はじめる"
- extendedWaitUntil:
    visible: "購入"
    timeout: 15000

# 表示順 index で tap（monthly=0 / annual=1 / lifetime=2）
- tapOn:
    text: "購入"
    index: 2

- extendedWaitUntil:
    visible: "Test valid purchase"
    timeout: 30000
- tapOn: "Test valid purchase"

- extendedWaitUntil:
    visible: "購入ありがとうございました"
    timeout: 30000

- takeScreenshot: screenshots/mock_purchase_lifetime_completed
