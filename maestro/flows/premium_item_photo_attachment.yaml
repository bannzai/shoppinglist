appId: com.bannzai.shoppinglist
---
# プレミアム状態ではアイテムに写真を添付できることを確認する。
# non_premium 版では SnackBar で遮断される。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# アイテム追加 → 詳細ボトムシート → 「写真を追加」
- tapOn: "アイテムを追加"
- inputText: "milk"
- pressKey: enter
# キーボード閉じる
- tapOn:
    point: "50%,6%"
- waitForAnimationToEnd
# milk テキスト本体タップはチェックトグル動作のため、`IconButton(tooltip: 'アイテム詳細',
# Icons.info_outline)` を tooltip 経由でタップして詳細ボトムシートを開く。
# 関連実装: lib/features/shopping_list/components/shopping_list_items/text_shopping_list_item.dart
- tapOn: "アイテム詳細"
- waitForAnimationToEnd
- tapOn: "写真を追加"
- waitForAnimationToEnd

# non_premium 時の SnackBar が出ないこと
- assertNotVisible: "商品写真の添付はプレミアム機能です"

- takeScreenshot: screenshots/premium_item_photo_attachment_unlocked
