appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# アイテムを追加（design v2: 空入力行「タップで入力開始」が追加導線）
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000
- tapOn: "タップで入力開始"
- inputText: "テスト商品"
- pressKey: enter
# 2 回目の Enter で空の入力行を畳む
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# 詳細ボトムシートを開く
- tapOn: "アイテム詳細"
- waitForAnimationToEnd

# 写真セクションが表示されること
- assertVisible: "写真"
- assertVisible: "写真を追加"
- takeScreenshot: screenshots/item_photo_01_photo_section_visible

# 非プレミアムユーザーが写真を追加しようとするとSnackBarが表示される
# SnackBarはFlutterオーバーレイのため Maestro のアクセシビリティツリーで検出困難。
# 「写真を追加」ボタン存在の確認で代替し、SnackBarテキストはunit testでカバー。
- tapOn: "写真を追加"
- takeScreenshot: screenshots/item_photo_02_non_premium_gate
