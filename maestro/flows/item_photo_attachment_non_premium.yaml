appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# アイテムを追加
- tapOn: "アイテムを追加"
- inputText: "テスト商品"
- pressKey: enter
# 空アイテムを削除
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# 詳細ボトムシートを開く
- tapOn: "アイテム詳細"
- waitForAnimationToEnd

# 写真セクションが表示されること
- assertVisible: "写真"
- assertVisible: "写真を追加"
- takeScreenshot: screenshots/item_photo_01_photo_section_visible

# 非プレミアムユーザーが写真を追加しようとするとSnackBarが表示される
- tapOn: "写真を追加"
- assertVisible: "商品写真の添付はプレミアム機能です"
- takeScreenshot: screenshots/item_photo_02_non_premium_gate
