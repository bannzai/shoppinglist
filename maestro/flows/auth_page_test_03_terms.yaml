appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# 通知許可ダイアログが表示される場合は許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
# clearState 直後は design v2 オンボーディングが表示されるためスキップする
- extendedWaitUntil:
    visible: "スキップ"
    timeout: 90000
- tapOn: "スキップ"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "サインインせずにはじめる"
    timeout: 30000
# 利用規約リンクをタップ
- tapOn: "利用規約"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "サインインせずにはじめる"
    timeout: 10000
- takeScreenshot: maestro/test-results/auth_page_03_terms
