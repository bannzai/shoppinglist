appId: com.bannzai.shoppinglist
---
# グループ切り替え後もリストが重複せず正常に動作することを確認するテスト
- runFlow: shared/anonymous_sign_in.yaml

# 設定タブに切り替え
- tapOn:
    text: "設定.*"
    index: 0

# グループ管理画面に遷移
- tapOn: "グループ管理"
- assertVisible: "グループ管理"

# グループ作成
- tapOn: "グループ作成"
- waitForAnimationToEnd
- assertVisible: "グループ作成"
# autofocus: trueなのでそのまま入力
- inputText: "TestEmptyGroup"
- tapOn:
    point: "50%,6%"
- tapOn: "作成する"
- waitForAnimationToEnd

# グループ管理画面からAppBarの戻るボタンで設定画面へ戻る
- tapOn: "Back"
- waitForAnimationToEnd

# 買い物リストタブに切り替え（NavigationBarの左側タブを座標でタップ）
- tapOn:
    point: "25%,96%"
- waitForAnimationToEnd

# GroupSwitcherで作成したグループに切り替え
- tapOn: "TestEmptyGroup"
- waitForAnimationToEnd

# app_entity_prepareがデフォルトグループにリストを自動作成するので、
# 「アイテムを追加」が表示されるまで待つ（リストが1つだけ作成されることを確認）
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 15000
- takeScreenshot: screenshots/empty_list_01_group_switched

# アイテムを追加して動作確認
- tapOn: "アイテムを追加"
- inputText: "milk"
- pressKey: enter
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd
- assertVisible: "milk"
- takeScreenshot: screenshots/empty_list_02_item_added
