appId: com.bannzai.shoppinglist
---
# プレミアム状態でカテゴリのロケーション別並び替えが操作可能であることを確認する。
# non_premium 版 (category_location_order_non_premium.yaml) では同じ操作で
# 「買い物場所ごとのカテゴリ並び替えはプレミアム機能です」SnackBar が出る。
# premium 版ではその SnackBar が非表示になることを assert する（弱 assert）。
#
# NOTE: 実際の並び替え挙動（ロケーション別 order の永続化）は Maestro の
# longPressAndDrag が iOS で安定しないため検証しない。Flutter unit test で
# sortCategoriesByLocation をカバー済み。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/mock_purchase.yaml

# 買い物場所を 1 つ追加（ロケーション選択ドロップダウンの選択肢として必要）
- tapOn: "リスト設定"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd
- tapOn: "グループ設定"
- waitForAnimationToEnd
- tapOn: "場所を追加"
- inputText: "Premium Mart"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# 場所追加後、画面上のどこにも non_premium 用の SnackBar が出ていないこと
- assertNotVisible: "買い物場所ごとのカテゴリ並び替えはプレミアム機能です"

- takeScreenshot: screenshots/premium_category_location_order_unlocked
