appId: com.bannzai.shoppinglist
---
- launchApp:
    clearState: true
    clearKeychain: true
# 通知許可ダイアログが表示される場合は許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 30000
# 匿名サインインボタンをタップ
- tapOn: "匿名サインイン（デバッグ用）"
- waitForAnimationToEnd
# permission-deniedエラーでRetryボタンが表示される場合がある
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
# ホーム画面への遷移を確認（「アイテムを追加」が表示されるまで待つ）
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 30000
- takeScreenshot: maestro/test-results/auth_page_04_home_after_signin
