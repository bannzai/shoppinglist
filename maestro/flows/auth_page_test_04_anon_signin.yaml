appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# 通知許可ダイアログが表示される場合は許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
# clearState 直後は design v2 オンボーディングが表示されるためスキップする
- extendedWaitUntil:
    visible: "スキップ"
    timeout: 90000
- tapOn: "スキップ"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 30000
# 匿名サインインボタンをタップ
- tapOn: "匿名サインイン（デバッグ用）"
- waitForAnimationToEnd
# permission-deniedエラーでRetryボタンが表示される場合がある
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
# 匿名サインイン後は GroupJoinOrCreatePage が表示されるため「自分のリストを作る」でホームへ進む。
- extendedWaitUntil:
    visible: "自分のリストを作る"
    timeout: 90000
- tapOn: "自分のリストを作る"
- waitForAnimationToEnd
# ホーム画面への遷移を確認（design v2 空状態の「タップで入力開始」が表示されるまで待つ）
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 30000
- takeScreenshot: maestro/test-results/auth_page_04_home_after_signin
