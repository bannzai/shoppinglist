appId: com.bannzai.shoppinglist
---
# サインアウト → Auth Stream 監視でサインイン画面(AuthPage)へ戻ることを検証する。
# 1) 匿名サインイン（debug ビルドでは匿名でも認証済み扱い）
# 2) 設定画面(push ルート)へ遷移し、最下部の「サインアウト」を確定
# 3) push 済みの設定画面が pop され、サインイン画面の要素が見えることを確認

- runFlow: shared/anonymous_sign_in.yaml

# 設定画面へ遷移する。設定はテキストタブではなく list_top_bar の設定アイコン
# (tooltip '設定') からの push ルート。settings_profile.yaml と同じ実績パターンで掴む。
- tapOn:
    text: "設定.*"
    index: 0
- assertVisible: "設定.*"
- waitForAnimationToEnd

# 「サインアウト」ボタンは設定画面の最下部にあるためスクロールして表示させる。
- scrollUntilVisible:
    element:
      text: "サインアウト"
    direction: DOWN
    timeout: 15000

# サインアウト確認ダイアログを開く
- tapOn: "サインアウト"
- waitForAnimationToEnd
# Maestro の text は完全一致(正規表現)。実際の文言は「サインアウトしますか?」(末尾?)なので .* を付ける。
- assertVisible:
    text: "サインアウトしますか.*"

# ダイアログ内の確定ボタン「サインアウト」を押す。設定画面側のボタンと文言が重複するため、
# ダイアログにのみ存在する「キャンセル」の右隣のピルとして一意に特定する。
- tapOn:
    text: "サインアウト"
    rightOf:
      text: "キャンセル"
- waitForAnimationToEnd

# サインイン画面(AuthPage)に戻ったことを確認する。
# anonymous_sign_in.yaml でオンボーディングは skip 済み(hasSeenOnboarding=true)のため
# OnboardingPage ではなく AuthPage が表示される。push 済みだった設定画面が pop され、
# 第1ルートの AuthResolver が表示する AuthPage の要素が見えることが本検証の核心。
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 30000
- assertVisible:
    text: "匿名サインイン（デバッグ用）"
