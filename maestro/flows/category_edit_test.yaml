appId: com.bannzai.shoppinglist
---
# カテゴリ編集のテスト（カラー設定・カラー解除・アイコン設定 + 画面離脱時の自動保存）
# design v2 ナビ: リスト設定 →「自動分類のキーワード管理」→ GroupCategoryPage。

- runFlow: shared/anonymous_sign_in.yaml

# カテゴリ管理画面（空状態）を開く
- tapOn: "リスト設定"
- waitForAnimationToEnd
- tapOn:
    text: "(?s).*自動分類のキーワード管理.*"
- waitForAnimationToEnd
- assertVisible: "カテゴリを追加"

# 「カテゴリを追加」→ ダイアログを挟まず編集画面へ直接遷移し、空名カテゴリが作成される
- tapOn: "カテゴリを追加"
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"

# 編集画面の TextField で名前を入力。iOS Flutter では hideKeyboard が不安定なため
# Enter(onSubmitted) でキーボードを閉じる（名前は値を保持し onDisappear で自動保存される）。
- tapOn: "カテゴリ名を入力"
- inputText: "テスト用"
- pressKey: enter
- waitForAnimationToEnd

# --- カラー設定テスト ---
# カテゴリカラーの 2 番目（赤）をタップ。Wrap 1 行目、⊘ の右隣。
- tapOn:
    point: "22%,33%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_edit_color_set

# --- カラー解除テスト ---
# 色なし（1 番目のサークル、⊘ アイコン）をタップ
- tapOn:
    point: "9%,33%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_edit_color_unset

# --- アイコン設定テスト ---
# カートアイコン（2 番目のアイコン）をタップ
- tapOn:
    point: "24%,50%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/category_edit_icon_set

# --- 自動保存（画面離脱）テスト ---
# 「完了」を押さず back シェブロン(左上 <)で離脱しても、入力したカテゴリ名が
# 一覧に反映されている（useOnDisappear による離脱時の自動保存を検証）。
# カテゴリ行は結合テキストのため (?s) 部分一致で待つ（Firestore 反映待ち）。
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?s).*テスト用.*"
    timeout: 10000
- takeScreenshot: screenshots/category_edit_autosaved
