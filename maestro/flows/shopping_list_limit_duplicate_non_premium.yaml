appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 初期 1 個 + CreateListFab で 19 個追加 = 20 個（freeGroupActiveShoppingListLimit）。
# design v2: リスト追加は CreateListFab（右下 89%,83%）を展開し「今日の日付でリストを追加」。
# 作成後はキーボードが FAB を覆うため毎回 hideKeyboard で閉じてから次の追加を行う。
- repeat:
    times: 19
    commands:
      - tapOn:
          point: "89%, 83%"
      - extendedWaitUntil:
          visible: "今日の日付でリストを追加"
          timeout: 8000
      - tapOn: "今日の日付でリストを追加"
      - waitForAnimationToEnd
      - hideKeyboard
      - waitForAnimationToEnd

# 21 個目を複製で試みる（上限超過）。CreateListFab 展開 →「現在のリストを複製」。
# 上限 SnackBar 本文(content の Text)は Flutter semantics に露出せず maestro の text 一致で
# 拾えないため、SnackBarAction のラベル「アップグレード」を assertVisible で捕捉する
# （通常ホームには存在せず上限 SnackBar 出現時のみ可視の一意信号）。本文はスクショで記録。
- tapOn:
    point: "89%, 83%"
- extendedWaitUntil:
    visible: "現在のリストを複製"
    timeout: 8000
- tapOn: "現在のリストを複製"
- assertVisible: "アップグレード"
- takeScreenshot: screenshots/shopping_list_limit_duplicate_01_exceeded
