appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# アイテムを追加（design v2: 空入力行「タップで入力開始」が追加導線）
- tapOn: "タップで入力開始"
- inputText: "醤油"
- pressKey: enter
# 2 回目の Enter で空の入力行を畳む
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# 詳細ボトムシートを開く（詳細アイコンに tooltip: 'アイテム詳細' を設定済み）
# Issue #464 で説明・写真・カラーの編集は廃止し、シートはカテゴリ確認・変更と削除のみ。
- tapOn: "アイテム詳細"
- waitForAnimationToEnd

# 廃止した説明・写真・カラーのセクションが表示されないこと
- assertNotVisible: "説明"
- assertNotVisible: "写真"
- assertNotVisible: "カラー"
- takeScreenshot: screenshots/item_detail_01_sheet

# 削除（タイトル右上のゴミ箱アイコン。tooltip: 'アイテムを削除'）
- tapOn: "アイテムを削除"
- assertVisible: "このアイテムを削除しますか？"
- tapOn:
    text: "削除"
    index: 0
- waitForAnimationToEnd

# 空リスト状態に戻る（design v2 の空入力行）
- assertVisible: "タップで入力開始"
- takeScreenshot: screenshots/item_detail_02_after_delete
