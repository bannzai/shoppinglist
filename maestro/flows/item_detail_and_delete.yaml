appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# アイテムを追加
- tapOn: "アイテムを追加"
- inputText: "醤油"
- pressKey: enter
# 空アイテムを削除
- pressKey: enter
# hideKeyboardはスクリーン上のリンクを誤タップする可能性があるため、
# AppBarタイトルの安全な領域をタップしてキーボードを閉じる
- hideKeyboard
- waitForAnimationToEnd

# 詳細ボトムシートを開く（info アイコンに tooltip: 'アイテム詳細' を設定済み）
- tapOn: "アイテム詳細"

# 説明を入力（80文字以内）
- assertVisible: "説明"
- tapOn: "補足説明を入力"
- inputText: "キッコーマンの丸大豆"

# カラーを選択（赤）
# カラー円に Semantics(label: preset.label) を設定済み
- tapOn: "赤"

# 保存ボタンは廃止。シート外(スクリム上部)をタップして閉じると変更が自動保存される
- tapOn:
    point: "50%,5%"
- waitForAnimationToEnd

# 再度詳細を開いて、説明・カラーが自動保存されていることを確認
- tapOn: "アイテム詳細"
- assertVisible: "キッコーマンの丸大豆"
- takeScreenshot: screenshots/item_detail_01_with_memo_color

# 削除（タイトル右上のゴミ箱アイコン。tooltip: 'アイテムを削除'）
- assertVisible: "説明"
- tapOn: "アイテムを削除"
- assertVisible: "このアイテムを削除しますか？"
- tapOn:
    text: "削除"
    index: 0
- waitForAnimationToEnd

# 空リスト状態に戻る
- assertVisible: "アイテムを追加"
- takeScreenshot: screenshots/item_detail_02_after_delete
