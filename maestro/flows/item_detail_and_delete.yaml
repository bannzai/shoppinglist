appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# アイテムを追加（design v2: 空入力行「タップで入力開始」が追加導線）
- tapOn: "タップで入力開始"
- inputText: "醤油"
- pressKey: enter
# 2 回目の Enter で空の入力行を畳む
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd

# 詳細ボトムシートを開く（info アイコンに tooltip: 'アイテム詳細' を設定済み）
- tapOn: "アイテム詳細"

# 説明を入力（80文字以内）
- assertVisible: "説明"
- tapOn: "補足説明を入力"
- inputText: "キッコーマンの丸大豆"

# カラーを選択（赤）
# カラー円に Semantics(label: preset.label) を設定済み
- tapOn: "赤"
- waitForAnimationToEnd

# 説明フィールドのフォーカスでキーボードが残りタップではシートが閉じないため、
# ドラッグハンドル(上部)から下方向へスワイプしてシートを dismiss する（=変更を自動保存）。
- swipe:
    start: "50%, 8%"
    end: "50%, 75%"
- waitForAnimationToEnd

# 再度詳細を開いて、説明・カラーが自動保存されていることを確認
- tapOn: "アイテム詳細"
- assertVisible: "キッコーマンの丸大豆"
- takeScreenshot: screenshots/item_detail_01_with_memo_color

# 削除（タイトル右上のゴミ箱アイコン。tooltip: 'アイテムを削除'）
- assertVisible: "説明"
- tapOn: "アイテムを削除"
- assertVisible: "このアイテムを削除しますか？"
- tapOn:
    text: "削除"
    index: 0
- waitForAnimationToEnd

# 空リスト状態に戻る（design v2 の空入力行）
- assertVisible: "タップで入力開始"
- takeScreenshot: screenshots/item_detail_02_after_delete
