appId: com.bannzai.shoppinglist
---
# プレミアム状態では AI 画像認識の月間利用回数が 50 回に拡張されることを確認する。
# non_premium では上限 5 回到達で SnackBar 末尾に「月50回まで利用できます」が付く。
# premium ではその末尾文字列が出ない。
#
# NOTE: 前提として /users/{uid}/aiUsage/{yyyy-MM} の imageRecognitionCount を 5 に
# 事前投入しないと SnackBar 自体が表示されないため、`optional: true` で安全に保護する。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/mock_purchase.yaml

# AI 画像認識の導線を開く
- tapOn:
    id: "popup_menu_button"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "画像から追加"
    optional: true
- waitForAnimationToEnd

# non_premium 時の末尾文言が出ないこと
- assertNotVisible: "プレミアムにアップグレードすると月50回まで利用できます"

- takeScreenshot: screenshots/premium_ai_image_recognition_unlocked
