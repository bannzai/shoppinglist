appId: ${APP_ID}
---
# 買い物リストの作成・リネーム・削除（design v2）。
# - 追加: 上部バー右の「リストを追加」メニュー（CreateListMenuButton, Issue #461）
#   →「今日の日付でリストを追加」
# - リネーム/削除: リスト設定（リスト名 セクション / このリストを削除）

- runFlow: shared/anonymous_sign_in.yaml

# --- 作成 ---
- tapOn: "リストを追加"
- extendedWaitUntil:
    visible: "今日の日付でリストを追加"
    timeout: 8000
- tapOn: "今日の日付でリストを追加"
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_01_new_list

# --- リスト設定を開く ---
- tapOn: "リスト設定"
- waitForAnimationToEnd
- assertVisible: "リスト名"

# --- リネーム: リスト名フィールド（最上部、現在名 "yyyy-MM-dd" が入っている。
# リスト名ラベル直下 ~50%,18%）をタップし、既存名を消して新しい名前を入力 → Enter で確定 ---
- tapOn:
    point: "50%, 18%"
- eraseText
- inputText: "週末の買い物"
- pressKey: enter
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_02_renamed

# --- 削除: 「このリストを削除」→ 確認ダイアログ → 削除 ---
- scrollUntilVisible:
    element:
      text: "(?s).*このリストを削除.*"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "(?s).*このリストを削除.*"
- waitForAnimationToEnd
- assertVisible:
    text: "(?s).*このリストを削除しますか.*"
- tapOn:
    text: "削除"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_03_after_delete
