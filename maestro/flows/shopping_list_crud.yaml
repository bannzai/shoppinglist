appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 三点メニューから買い物リストを追加（tooltip: 'メニュー' を設定済み）
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd

# ボトムシートで「買い物リストを追加」を選択
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_01_new_list

# リスト設定を開いてリスト名を変更（tooltip: 'リスト設定' を設定済み）
- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"

# リスト名のTextField領域をタップしてフォーカスする
- tapOn:
    point: "50%,33%"
- eraseText
- inputText: "週末の買い物"
- pressKey: enter
- hideKeyboard
# AppBarタイトルをタップしてTextFieldのフォーカスを外す
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_02_renamed

# 削除ボタンをタップ
- tapOn: "買い物リストを削除"
- assertVisible: "買い物リストを削除しますか？"
- tapOn:
    text: "削除"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: screenshots/list_crud_03_after_delete
