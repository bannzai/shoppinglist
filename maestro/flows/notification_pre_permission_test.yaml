appId: ${APP_ID}
---
# 通知プリパーミッションダイアログ (Issue #500) の E2E:
# グループ作成 → 招待コード dialog を閉じた直後にプリパーミッションダイアログが表示され、
# 「通知を許可」で OS の通知許可ダイアログが出ることを確認する。
#
# 注意: iOS の通知許可は一度確定すると同じインストール状態では再表示されず、
# アプリ削除や simulator erase でしかリセットできない。そのためこのフローは
# アプリが一度も通知許可を要求していない simulator でのみ全ステップが通る
# (2 回目以降はプリパーミッション自体が表示されずタイムアウトで失敗する)。
- runFlow: shared/anonymous_sign_in.yaml

# 設定タブ → グループ管理 → グループ作成
- tapOn:
    text: "設定.*"
    index: 0
- tapOn: "グループ管理"
- tapOn: "グループ作成"
- assertVisible: "グループ名"
# name フィールドは autofocus のため inputText を直接流せる
- inputText: "通知テストグループ"
- tapOn: "作成する"

# 作成後の「メンバーを招待」ダイアログ（招待コード）を閉じる
- extendedWaitUntil:
    visible: "閉じる"
    timeout: 10000
- tapOn: "閉じる"

# プリパーミッションダイアログが表示されること。
# ダイアログのタイトルと本文は 1 つの semantics ノードに結合されるため、
# タイトル単体の完全一致では検出できない。固有ボタン「通知を許可」で検出する
# (notify_group_button_test.yaml と同じ方式)。
- extendedWaitUntil:
    visible: "通知を許可"
    timeout: 10000
- takeScreenshot: screenshots/notification_pre_permission_01_dialog
- tapOn: "通知を許可"

# OS の通知許可ダイアログが表示されること
- extendedWaitUntil:
    visible: "許可"
    timeout: 10000
- takeScreenshot: screenshots/notification_pre_permission_02_os_dialog
- tapOn: "許可"
- waitForAnimationToEnd

# ダイアログが閉じてグループ管理画面に戻ること
- extendedWaitUntil:
    visible: "グループ管理"
    timeout: 15000
- takeScreenshot: screenshots/notification_pre_permission_03_after_grant
