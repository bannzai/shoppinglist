appId: com.bannzai.shoppinglist
---
# プレミアム状態では位置情報リマインダーを有効化できることを確認する。
# non_premium 版では SnackBar で遮断される。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# 設定 → 位置情報リマインダー Switch（grant_premium_via_debug.yaml 終了時点で設定画面の
# 下方にいるため UP 方向にスクロールして位置情報リマインダー ListTile まで戻す）
- tapOn:
    text: "設定.*"
    index: 0
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "位置情報リマインダー"
    direction: UP
    timeout: 30000
- tapOn: "位置情報リマインダー"
- waitForAnimationToEnd

# non_premium 時の SnackBar が出ないこと
- assertNotVisible: "位置情報リマインダーはプレミアム機能です"

# 位置情報権限ダイアログが出たら許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd

- takeScreenshot: screenshots/premium_location_reminder_unlocked
