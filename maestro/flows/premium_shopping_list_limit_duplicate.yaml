appId: ${APP_ID}
---
# プレミアム状態ではリスト複製でも 21 個目以降を作成できることを確認する。
# non_premium では複製で 21 個目を作ろうとすると上限 SnackBar の CTA「アップグレード」で遮断される
# （shopping_list_limit_duplicate_non_premium.yaml 参照）。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# 初期 1 個 + リスト追加メニューで 19 個追加 = 20 個（free 上限）。
# リスト追加は上部バー右の「リストを追加」メニュー（CreateListMenuButton, Issue #461）から
# 「今日の日付でリストを追加」。作成後はキーボードが開くため毎回 hideKeyboard で閉じて
# 画面状態を揃えてから次の追加を行う。
- repeat:
    times: 19
    commands:
      - tapOn: "リストを追加"
      - extendedWaitUntil:
          visible: "今日の日付でリストを追加"
          timeout: 8000
      - tapOn: "今日の日付でリストを追加"
      - waitForAnimationToEnd
      - hideKeyboard
      - waitForAnimationToEnd

# 21 個目を複製で作成する。「リストを追加」メニュー →「現在のリストを複製」。
# premium では上限 SnackBar の CTA「アップグレード」が出ず複製が成功する。
- tapOn: "リストを追加"
- extendedWaitUntil:
    visible: "現在のリストを複製"
    timeout: 8000
- tapOn: "現在のリストを複製"
- waitForAnimationToEnd

# 上限 SnackBar の CTA「アップグレード」が出ないこと = premium で複製でも無制限。
- assertNotVisible: "アップグレード"
- takeScreenshot: screenshots/premium_shopping_list_limit_duplicate_unlocked
