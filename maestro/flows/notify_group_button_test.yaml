appId: ${APP_ID}
---
# グループへの更新通知ボタン(NotifyGroupButton)の検証。
# ソログループでは非表示、他メンバーが居るときのみ表示され、
# 初回タップのみ説明ダイアログを出し、2回目以降は確認なしで送信することを確認する。

- runFlow: shared/anonymous_sign_in.yaml
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 15000

# ソログループでは通知ボタン(ベルアイコン、tooltip="グループに通知")が非表示であることを確認
- assertNotVisible: "グループに通知"
- takeScreenshot: screenshots/notify_group_01_solo_hidden

# デバッグユーザーを作成し、グループに追加(2人以上のグループにする)
- runFlow: virtual_pairing/02_create_debug_user.yaml
- runFlow: virtual_pairing/03_add_to_group.yaml

# この端末のFCMトークンをデバッグユーザーに登録し、
# 送信するプッシュを自端末で受信できるようにする(1台でのプッシュ実受信検証)
- runFlow: shared/register_debug_fcm_token_via_debug.yaml

# 他メンバーが居るため通知ボタンが表示される
- assertVisible: "グループに通知"
- takeScreenshot: screenshots/notify_group_02_button_visible

# 初回タップ: 説明ダイアログが出る
# (ダイアログタイトルとボタン tooltip が同一テキスト"グループに通知"のため、
#  モーダルの陰に隠れたボタン側の要素と誤認されないよう、ダイアログ固有の
#  「通知を送る」ボタンでのみアサートする)
- tapOn: "グループに通知"
- assertVisible: "通知を送る"
- takeScreenshot: screenshots/notify_group_03_guide_dialog
- tapOn: "通知を送る"
# 送信フィードバックの確認。トーストは単一表示（新しい show が即置き換える）のため、
# APNs 配送が速いと「グループに通知しました」は自分宛プッシュのトースト
# 「◯◯さんが買い物リストを更新しました」に数十msで置き換わる（実測で send 結果の
# 39ms 後に onMessage 発火）。どちらが見えても送信成功の証跡になるため両方を許容する。
- assertVisible: "(?s).*(グループに通知しました|さんが買い物リストを更新しました).*"
- takeScreenshot: screenshots/notify_group_04_toast_first_tap

# プッシュ通知の実受信検証: デバッグユーザー宛に送られたプッシュがこの端末に届き、
# フォアグラウンド受信ハンドラ(FcmNotificationHandler.onMessage)がグローバルトーストを
# 表示することを確認する。
# 配送遅延(Functions → FCM → APNs → sim で 30〜90 秒かかり得る。issue #500 検証の実測)
# を考慮した timeout にしている。配送が遅い通常ケースでは「グループに通知しました」は
# 先に消えているため、この 90 秒待ちがプッシュトースト
# 「◯◯さんが買い物リストを更新しました」単独の受信検証として機能する。
# 「グループに通知しました」も許容する理由: 配送が数十msで完了することがあり
# (実測で send 結果の前後 ±40ms に onMessage 発火)、トーストは単一表示のため
# プッシュトーストと送信フィードバックのどちらが生き残るかが非決定的になる。
# プッシュテキストのみを要求すると、送信フィードバックが後から上書きした順序で
# 二度と現れず必ず失敗する。
# (?s) を付ける理由: プッシュトーストは title + body の2行構成で、iOS の
# アクセシビリティツリー上は改行結合された1要素になる。Maestro の正規表現は
# 全体マッチかつ `.` が改行にマッチしないため、DOTALL 指定がないと title 行に
# 続く body 行を `.*` が跨げずマッチに失敗する。
- extendedWaitUntil:
    visible: "(?s).*(さんが買い物リストを更新しました|グループに通知しました).*"
    timeout: 90000
- takeScreenshot: screenshots/notify_group_05_push_received

- waitForAnimationToEnd

# 2回目タップ: ダイアログを出さず即送信する
# (ダイアログが出た場合は送信されずトーストも出ないため、トーストの確認だけで
#  ダイアログレス送信の検証になる。両方許容する理由は1回目タップのコメント参照)
- tapOn: "グループに通知"
- assertVisible: "(?s).*(グループに通知しました|さんが買い物リストを更新しました).*"
- takeScreenshot: screenshots/notify_group_06_toast_second_tap
