appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# 新規ユーザーは非プレミアムのため、リスト設定の「保存期間」セクションに
# 「作成から30日間」と表示されることを確認する（design v2 SSOT 文言）。
# リスト設定はギアアイコン（tooltip→accessibilityText「リスト設定」）から開く。
- tapOn: "リスト設定"
- extendedWaitUntil:
    visible: "買い物リスト設定"
    timeout: 8000
# 保存期間セクションは画面下方にあるためスクロールして表示させる
- scrollUntilVisible:
    element:
      text: "保存期間"
    direction: DOWN
    timeout: 15000
- assertVisible: "保存期間"
- assertVisible: "作成から30日間"
- takeScreenshot: screenshots/display_period_03_setting_free_user

# 設定を閉じる
- back
