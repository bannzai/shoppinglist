appId: com.bannzai.shoppinglist
---
# プレミアム状態でリストエクスポートが実行できることを確認する。
# non_premium 版では SnackBar で遮断される。

- runFlow: shared/anonymous_sign_in.yaml
- runFlow: shared/grant_premium_via_debug.yaml

# メニュー → リストをエクスポート
- tapOn: "メニュー"
- waitForAnimationToEnd
- tapOn: "リストをエクスポート"
- waitForAnimationToEnd

# non_premium 時の SnackBar が出ないことを確認する。
# iOS / Android のネイティブ共有シートは Maestro で安定に操作できないため、
# SnackBar 非出現とスクリーンショットで代替する（non_premium と同じ弱 assert 方針）。
- assertNotVisible: "リストのエクスポートはプレミアム機能です"

- takeScreenshot: screenshots/premium_export_shopping_list_unlocked
