appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# 設定タブに切り替え
# text は正規表現。NavigationBarのラベル "設定\nTab 2 of 2" にマッチさせるため "設定.*" を使用
- tapOn:
    text: "設定.*"
    index: 0
- assertVisible: "設定.*"

# グループ管理画面に遷移
- tapOn: "グループ管理"
- assertVisible: "グループ管理"
- takeScreenshot: screenshots/group_creation_limit_01_group_list

# FABをタップしてグループ作成を試みる（FABのtooltip "グループ作成" を使用）
- tapOn: "グループ作成"
- waitForAnimationToEnd

# グループ作成画面が表示された場合（グループ名ラベルで判定） → グループを作成して上限に到達させる
# "グループ作成" はFABのtooltipにもマッチするため、グループ作成画面固有の "グループ名" で判定
- runFlow:
    when:
      visible: "グループ名"
    commands:
      - inputText: "テストグループ"
      # hideKeyboard は iOS で不安定。「作成する」はキーボードの上にあるため直接タップする。
      - tapOn: "作成する"
      # 作成後「メンバーを招待」ダイアログ（招待コード）が出るため閉じる
      - extendedWaitUntil:
          visible: "閉じる"
          timeout: 10000
      - tapOn: "閉じる"
      - extendedWaitUntil:
          visible: "グループ管理"
          timeout: 15000
      # 上限到達後、FAB はロックされ「グループ作成」ラベルが無くなるため optional でタップを試みる。
      - tapOn:
          text: "グループ作成"
          optional: true
      - waitForAnimationToEnd
      # FAB ロックで作成画面（グループ名）が開かないことを確認する。
      - assertNotVisible: "グループ名"

# 上限超過時、グループ管理画面に留まりFABにロックアイコンが表示されること
# SnackBarはFlutterオーバーレイのためMaestroで検出困難。ロジックはunit testでカバー。
- assertVisible: "グループ管理"
- takeScreenshot: screenshots/group_creation_limit_02_exceeded
