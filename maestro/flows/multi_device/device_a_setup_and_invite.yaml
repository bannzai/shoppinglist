appId: com.bannzai.shoppinglist
---
- runFlow: ../shared/anonymous_sign_in.yaml

# 設定タブに切り替え
- tapOn:
    text: "設定.*"
    index: 0

# グループ管理画面に遷移
- tapOn: "グループ管理"
- assertVisible: "グループ管理"

# グループ作成
- tapOn: "グループ作成"
- tapOn: "グループ名を入力"
- inputText: "テスト共有グループ"
- tapOn:
    point: "50%,6%"
- tapOn: "作成する"
- waitForAnimationToEnd

# グループ作成後、グループリスト画面に戻る
# Maestroのテキストマッチングが効かないため、座標をスクロールで確認してタップ
- scrollUntilVisible:
    element:
      text: ".*テスト共有.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: ".*テスト共有.*"
    index: 0
- assertVisible: "グループ設定"

# 招待コード生成
- tapOn: "グループに招待"
- extendedWaitUntil:
    visible: "招待コード"
    timeout: 15000
- takeScreenshot: screenshots/multi_device/device_a_invitation_code
