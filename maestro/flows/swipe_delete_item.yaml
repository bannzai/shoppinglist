appId: com.bannzai.shoppinglist
---
# 左スワイプ削除 → Undo（元に戻す）の E2E。
# NOTE: 共通の shared/anonymous_sign_in.yaml は design v2 のオンボーディング表示と
#       空状態 UI（「タップで入力開始」）にまだ追従していないため、このフローでは
#       サインインまでを自前で記述する。
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
# オンボーディングが表示されたらスキップ
- runFlow:
    when:
      visible: "スキップ"
    commands:
      - tapOn: "スキップ"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 90000
- tapOn: "匿名サインイン（デバッグ用）"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
# 匿名サインイン後は GroupJoinOrCreatePage が表示されるため「自分のリストを作る」でホームへ進む。
- extendedWaitUntil:
    visible: "自分のリストを作る"
    timeout: 90000
- tapOn: "自分のリストを作る"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "タップで入力開始"
    timeout: 60000

# アイテムを追加（空状態の「タップで入力開始」行から入力する）
- tapOn: "タップで入力開始"
- waitForAnimationToEnd
- inputText: "削除テスト用アイテム"
- pressKey: enter
# 連続入力で生成される空アイテムを確定して削除
- pressKey: enter
- hideKeyboard
- waitForAnimationToEnd
- assertVisible: "削除テスト用アイテム"
- takeScreenshot: screenshots/swipe_delete_01_before

# 左スワイプで削除（Dismissible direction: endToStart）。
# このアプリでは右スワイプ=チェック切替、左スワイプ=削除。
# 先頭アイテム行は design_v2_list_core.yaml と同じ y=21% にあるため、同じ実証済み座標
# （右端 88% → 左端 8%）でスワイプして dismissThreshold(幅の40%) を超える。
- swipe:
    start: "88%, 21%"
    end: "8%, 21%"
- waitForAnimationToEnd

# 削除され、Undo SnackBar が表示される
- assertNotVisible: "削除テスト用アイテム"
- assertVisible: "元に戻す"
- takeScreenshot: screenshots/swipe_delete_02_deleted

# 「元に戻す」で削除前の状態に復元される
- tapOn: "元に戻す"
- waitForAnimationToEnd
- assertVisible: "削除テスト用アイテム"
- takeScreenshot: screenshots/swipe_delete_03_restored
