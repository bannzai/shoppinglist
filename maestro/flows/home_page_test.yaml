appId: com.bannzai.shoppinglist
---
- launchApp:
    clearState: true
    clearKeychain: true

# 通知許可ダイアログが表示された場合は許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn:
          text: "許可"
          retryTapIfNoChange: false
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "サインイン"
    timeout: 30000
- tapOn: "匿名サインイン（デバッグ用）"
- waitForAnimationToEnd
# permission-deniedエラーでRetryボタンが表示される場合がある
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 30000

# 確認1: 起動時に ShoppingListPage が表示される（下部タブは廃止済み）
- assertVisible: "アイテムを追加"
- takeScreenshot: screenshots/home_01_shopping_list_only

# 確認2: ヘッダー右上の設定アイコンタップで SettingPage が push 遷移
- tapOn:
    id: "app_settings_button"
- extendedWaitUntil:
    visible: "プロフィール"
    timeout: 5000
- takeScreenshot: screenshots/home_02_app_settings_pushed

# 確認3: 閉じる(×)で買い物リスト画面に戻る
- tapOn:
    id: "close"
- extendedWaitUntil:
    visible: "アイテムを追加"
    timeout: 5000
- takeScreenshot: screenshots/home_03_back_to_shopping_list
