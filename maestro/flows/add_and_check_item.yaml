appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 空リスト状態を確認（design v2: スターター行「タップで入力開始」が表示される）
- assertVisible: "タップで入力開始"
- takeScreenshot: screenshots/add_item_01_empty

# スターター行をタップして入力開始
- tapOn: "タップで入力開始"

# アイテムのテキストを入力
# Enter送信でアイテムが保存され、新しい空アイテムが自動作成される
- inputText: "牛乳"
- pressKey: enter
- inputText: "卵"
- pressKey: enter
- inputText: "パン"
- pressKey: enter
# 最後のEnterで自動作成された空アイテムを削除（空テキストでEnter→削除）
- pressKey: enter

# キーボードを閉じる
- hideKeyboard
- waitForAnimationToEnd

# 3アイテム追加されたことを確認
- assertVisible: "牛乳"
- assertVisible: "卵"
- assertVisible: "パン"
- takeScreenshot: screenshots/add_item_02_items_added

# 1つ目のアイテム（牛乳）のチェックボックスをタップ
# text: "牛乳" 指定だと TextField 側にマッチしてフォーカスが当たるだけになるため、
# 行左端の円形チェックボックスを明示座標でタップする（design v2 レイアウト基準）
- tapOn:
    point: "7%,23%"
- waitForAnimationToEnd
- takeScreenshot: screenshots/add_item_03_one_checked

# チェック済みアイテムも一覧に表示され続けることを確認（Issue #373: チェック済み表示は常時ON固定）
- assertVisible: "牛乳"
- assertVisible: "1/3"
- takeScreenshot: screenshots/add_item_04_checked_item_visible
