appId: ${APP_ID}
---
# PR-3 AI review sheet の検証:
# - AI 抽出後に review sheet が表示されることを assert
# - 選択数バッジ / キャンセル / N件追加 の表示を assert
#
# 前提: URL 抽出の経路はテスト環境で外部 fetch が走るため、本フローでは UI 到達のみ assert する。
# 実 API 呼び出しは ai_url_recognition_limit.yaml が担当する。

- runFlow: shared/anonymous_sign_in.yaml

# design v2: FAB タップは行追加、長押しで写真/URL/貼り付けの展開メニューを開く。
# FAB は右下に配置されるため point 指定で長押しする。
- longPressOn:
    point: "92%, 90%"
    optional: true
- waitForAnimationToEnd
# 「URL から追加」を選ぶ（行全体がタップ領域）。
- tapOn:
    text: "URL から追加"
    optional: true
- waitForAnimationToEnd

# URL 入力 dialog が出ることを assert (review sheet までは外部 fetch が要るため optional)
- assertVisible:
    text: "URLから買い物リストを生成"
    optional: true
