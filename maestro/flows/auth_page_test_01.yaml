appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
# 通知許可ダイアログが表示される場合は許可する
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "匿名サインイン（デバッグ用）"
    timeout: 30000
- takeScreenshot: maestro/test-results/auth_page_01_signin
