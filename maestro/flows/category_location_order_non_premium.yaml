appId: ${APP_ID}
---
# 非プレミアムユーザーのカテゴリロケーション別並び替え制限テスト
# 匿名ログイン（非プレミアム）でカテゴリ・買い物場所を作成し、
# 買い物リストでロケーション別ソートがデフォルト順にフォールバックされることを確認する

- runFlow: shared/anonymous_sign_in.yaml

# --- リスト設定→グループ設定を開く ---

- tapOn: "リスト設定"
- assertVisible: "買い物リスト設定"
# TextFieldのフォーカスを外す
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd

- tapOn: "グループ設定"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# --- 買い物場所の作成 ---

- tapOn: "場所を追加"
- assertVisible: "場所を追加"
- tapOn: "場所の名前（例: スーパー）"
- inputText: "テストスーパー"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "テストスーパー"

# --- カテゴリ作成: 野菜（キーワード: にんじん） ---

- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "野菜"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"

- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "にんじん"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"

# --- カテゴリ作成: 肉（キーワード: 鶏肉） ---

- scrollUntilVisible:
    element: "カテゴリを追加"
    direction: DOWN
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- tapOn: "カテゴリ名（例: 野菜）"
- inputText: "肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd
- assertVisible: "カテゴリ編集"

- tapOn: "キーワードを追加"
- assertVisible: "キーワードを追加"
- inputText: "鶏肉"
- tapOn:
    text: "追加"
    index: 0
- waitForAnimationToEnd

# グループ設定に戻る
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "グループ設定"
- takeScreenshot: screenshots/premium_cat_loc_01_setup_done

# --- リスト設定に戻る ---
- tapOn:
    point: "5%,10%"
- waitForAnimationToEnd
- assertVisible: "買い物リスト設定"

# TextFieldのフォーカスを外す
- tapOn:
    point: "50%,12%"
- waitForAnimationToEnd

# 買い物する場所で「テストスーパー」を選択
- tapOn: "なし"
- waitForAnimationToEnd
- tapOn: "テストスーパー"
- waitForAnimationToEnd

# BottomSheetを閉じる
- tapOn:
    point: "5%,12%"
- waitForAnimationToEnd

# --- アイテム追加 ---

- tapOn: "アイテムを追加"
- inputText: "にんじん"
- pressKey: enter
- inputText: "鶏肉"
- pressKey: enter
# 空アイテム削除
- pressKey: enter

# キーボード閉じてフォーカス解除
- tapOn:
    point: "50%,6%"
- waitForAnimationToEnd

# Firestoreデータ同期待ち＆カテゴリヘッダー表示確認
- extendedWaitUntil:
    visible: "野菜"
    timeout: 10000
- extendedWaitUntil:
    visible: "肉"
    timeout: 5000

# 非プレミアムユーザーなのでロケーション別ソートは無効化され、
# デフォルトの order 順で表示される（野菜=0, 肉=1 → 野菜が先に表示される）
# スクリーンショットで目視確認
- takeScreenshot: screenshots/premium_cat_loc_02_default_order_non_premium
