appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 1個目のリストは初期作成済み（anonymous_sign_in でソログループ作成時に1個作られる）。
# 残り19個を追加して合計20個（freeGroupActiveShoppingListLimit）にする。
# design v2: リスト追加は CreateListFab（上側 FAB, 右下 89%,83%）を展開し
# 「今日の日付でリストを追加」をタップする。作成は空アイテム追加+フォーカスまで
# 連鎖しキーボードが FAB を覆うため、毎回 hideKeyboard で閉じてから次の追加を行う。
- repeat:
    times: 19
    commands:
      - tapOn:
          point: "89%, 83%"
      - extendedWaitUntil:
          visible: "今日の日付でリストを追加"
          timeout: 8000
      - tapOn: "今日の日付でリストを追加"
      - waitForAnimationToEnd
      - hideKeyboard
      - waitForAnimationToEnd

# 21個目（上限超過）— ShoppingListLimitExceededException の SnackBar が表示される。
# SnackBar 本文(content の Text)は Flutter の semantics に露出せず maestro の text 一致で
# 拾えない(extendedWaitUntil でも 0 件)。一方 SnackBarAction のラベル「アップグレード」は
# button semantics として露出し、tap 直後の assertVisible で確実に捕捉できる。
# 「アップグレード」は通常ホームには存在せず上限 SnackBar 出現時のみ可視のため一意の信号になる
# (assertNotVisible で誤検出が無いことを確認済み)。本文全文はスクリーンショットで視覚的に記録する。
- tapOn:
    point: "89%, 83%"
- extendedWaitUntil:
    visible: "今日の日付でリストを追加"
    timeout: 8000
- tapOn: "今日の日付でリストを追加"
- assertVisible: "アップグレード"
- takeScreenshot: screenshots/shopping_list_limit_01_exceeded
