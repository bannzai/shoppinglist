appId: com.bannzai.shoppinglist
---
- runFlow: shared/anonymous_sign_in.yaml

# 1個目のリストは初期作成済み（anonymous_sign_inで作成される）
# 残り4個を追加して合計5個にする

# 2個目
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd

# 3個目
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd

# 4個目
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd

# 5個目
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd

# 6個目（上限超過） — SnackBarが表示されるはず
- tapOn: "メニュー"
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- tapOn: "買い物リストを追加"
- waitForAnimationToEnd
- assertVisible: "無料プランでは1グループあたり5個までリストを作成できます"
- takeScreenshot: screenshots/shopping_list_limit_01_exceeded
