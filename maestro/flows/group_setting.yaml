appId: ${APP_ID}
---
- runFlow: shared/anonymous_sign_in.yaml

# 設定タブに切り替え
- tapOn:
    text: "設定.*"
    index: 0
- assertVisible: "設定.*"

# グループ管理画面に遷移
- tapOn: "グループ管理"
- assertVisible: "グループ管理"

# グループ作成
- tapOn: "グループ作成"
- assertVisible: "グループ作成"
- tapOn: "グループ名を入力"
- inputText: "テストグループ"
- pressKey: Enter
- tapOn: "作成する"
- extendedWaitUntil:
    visible: "グループ管理"
    timeout: 15000

# グループ設定画面に遷移（グループリストからタップ）
- extendedWaitUntil:
    visible: ".*テストグループ.*"
    timeout: 10000
- tapOn: ".*テストグループ.*"
- assertVisible: "グループ設定"
- takeScreenshot: screenshots/group_setting_01_initial

# グループ名編集 → onSubmittedで保存
- tapOn: "テストグループ"
- eraseText: 7
- inputText: "更新されたグループ"
- pressKey: Enter
- takeScreenshot: screenshots/group_setting_02_name_saved

# 場所を追加
- scrollUntilVisible:
    element: "場所を追加"
    direction: DOWN
- tapOn: "場所を追加"
- assertVisible: "場所を追加"
- inputText: "スーパー"
- tapOn: "追加"
- waitForAnimationToEnd
- assertVisible: "スーパー"
- takeScreenshot: screenshots/group_setting_03_location_added

# カテゴリを追加
- scrollUntilVisible:
    element: "カテゴリを追加"
    direction: DOWN
- tapOn: "カテゴリを追加"
- assertVisible: "カテゴリを追加"
- inputText: "野菜"
- tapOn: "追加"
- waitForAnimationToEnd
# カテゴリ追加後はカテゴリ編集画面に遷移する
- assertVisible: "カテゴリ編集"
- takeScreenshot: screenshots/group_setting_04_category_edit
- tapOn: "Back"

# グループ設定画面に戻り、カテゴリが表示されていることを確認
- assertVisible: "グループ設定"
- extendedWaitUntil:
    visible: ".*野菜.*"
    timeout: 10000
- takeScreenshot: screenshots/group_setting_05_category_added

# スクリーンショット（最終状態）
- scrollUntilVisible:
    element: "グループに招待"
    direction: DOWN
- takeScreenshot: screenshots/group_setting_06_final
