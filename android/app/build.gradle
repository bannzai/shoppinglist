plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// リリース署名情報。CI では key.properties / upload-keystore.jks を GitHub Secrets から復元して配置する。
// key.properties が無いローカル環境では debug 署名にフォールバックし `flutter run --release` を壊さない。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.bannzai.shoppinglist"
    compileSdk = Math.max(flutter.compileSdkVersion, 36)
    ndkVersion = flutter.ndkVersion

    // flutter_local_notifications 21.0.0 は core library desugaring + Java 17 を要求する
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.bannzai.shoppinglist"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Android 8.0 以上をサポート対象とする (Issue #232)
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Google Maps クライアントキー。AndroidManifest の geo.API_KEY=${GOOGLE_MAPS_API_KEY} が参照(全 buildType で必須)。
        // 既定は prod(base applicationId 用。profile/release が継承)。debug は buildTypes で dev に上書き。
        // クライアント埋め込み前提の公開情報のため直書き。GCP でアプリ制限(package+SHA-1)+API制限(Maps SDK for Android)を必須とする(Issue #410 / ADR 0030)。
        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = "AIzaSyACylrSYjCSNXVnfH3vTgg2nM1HJfB0VTI"
        // AdMob App ID (Issue #77)。AndroidManifest の com.google.android.gms.ads.APPLICATION_ID が参照。
        // 未設定だと Google Mobile Ads SDK の初期化でクラッシュするため必須。
        // 現在は Google 公式のサンプル App ID(テスト用)。AdMob でアプリ登録後、本番リリース前に必ず実 ID へ差し替える。
        // https://developers.google.com/admob/android/quick-start#configure_your_app
        manifestPlaceholders["ADMOB_APP_ID"] = "ca-app-pub-3940256099942544~3347511713"
    }

    signingConfigs {
        release {
            // key.properties が存在する場合（= CI で Secrets から復元済み）のみ実値をセットする。
            // 存在しない場合はこの signingConfig は未設定のまま使われない（release は debug にフォールバック）。
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            // dev Firebase プロジェクト(package=com.bannzai.shoppinglist.dev)に対応(Issue #410 / ADR 0030)。
            // namespace(=R class package)は据え置き、applicationId のみ .dev を付与する。
            // google-services.json は src/debug/(dev) を google-services plugin が優先採用する。
            applicationIdSuffix = ".dev"
            // dev applicationId(.dev)に対応する dev Maps キーへ上書き。
            manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = "AIzaSyDcfsSO2_2lHNaP-yo-zU51iKEB-midNBw"
        }
        release {
            // key.properties があればリリース署名（Google Play 配布用）、無ければ debug 署名にフォールバックして
            // ローカルの `flutter run --release` を維持する。
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.9.0")
    implementation "com.google.firebase:firebase-common"
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source = "../.."
}
