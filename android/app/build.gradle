plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// リリース署名情報。CI では key.properties / upload-keystore.jks を GitHub Secrets から復元して配置する。
// key.properties が無いローカル環境では debug 署名にフォールバックし `flutter run --release` を壊さない。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google Maps クライアントキー(dev/prod)。値は GCP Secret Manager (google-maps-sdk-android-apikey) が正で、
// `make secret` が gitignore 済みの google-maps.properties に googleMapsApiKeyDev / googleMapsApiKeyProd を書き出す(ADR 0035)。
// ファイルが無い環境 (secret を復元していない CI の lint / test 等) では空文字にし、manifest の placeholder 解決を壊さない。
def googleMapsProperties = new Properties()
def googleMapsPropertiesFile = rootProject.file('google-maps.properties')
if (googleMapsPropertiesFile.exists()) {
    googleMapsProperties.load(new FileInputStream(googleMapsPropertiesFile))
}

android {
    namespace = "com.bannzai.shoppinglist"
    compileSdk = Math.max(flutter.compileSdkVersion, 36)
    ndkVersion = flutter.ndkVersion

    // flutter_local_notifications 21.0.0 は core library desugaring + Java 17 を要求する
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.bannzai.shoppinglist"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Android 8.0 以上をサポート対象とする (Issue #232)
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Google Maps クライアントキー。AndroidManifest の geo.API_KEY=${GOOGLE_MAPS_API_KEY} が参照(全 buildType で必須)。
        // 既定は prod(base applicationId 用。profile/release が継承)。debug は buildTypes で dev に上書き。
        // GCP でアプリ制限(package+SHA-1)+API制限(Maps SDK for Android)を掛けたキー(Issue #410 / ADR 0030)を、
        // make secret が書き出す google-maps.properties から読む(ADR 0035)。
        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = googleMapsProperties.getProperty("googleMapsApiKeyProd", "")
        // AdMob App ID (Issue #77)。AndroidManifest の com.google.android.gms.ads.APPLICATION_ID が参照。
        // AdMob 自体は Issue #540 で撤去済み(SDK なしでは manifest の値は読まれない)が、
        // 再導入に備えて App ID の Env は意図的に残している。
        // クライアント埋め込み前提の公開情報のため直書き。
        manifestPlaceholders["ADMOB_APP_ID"] = "ca-app-pub-9127772965271297~5311886092"
    }

    signingConfigs {
        release {
            // key.properties が存在する場合（= CI で Secrets から復元済み）のみ実値をセットする。
            // 存在しない場合はこの signingConfig は未設定のまま使われない（release は debug にフォールバック）。
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            // dev Firebase プロジェクト(package=com.bannzai.shoppinglist.dev)に対応(Issue #410 / ADR 0030)。
            // namespace(=R class package)は据え置き、applicationId のみ .dev を付与する。
            // google-services.json は src/debug/(dev) を google-services plugin が優先採用する。
            applicationIdSuffix = ".dev"
            // dev applicationId(.dev)に対応する dev Maps キーへ上書き。
            manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = googleMapsProperties.getProperty("googleMapsApiKeyDev", "")
        }
        release {
            // key.properties があればリリース署名（Google Play 配布用）、無ければ debug 署名にフォールバックして
            // ローカルの `flutter run --release` を維持する。
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-common"
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    testImplementation "junit:junit:4.13.2"
    // JVM の単体テストでは android.jar の org.json がスタブで例外を投げるため、実装を足す
    testImplementation "org.json:json:20260814"
}

flutter {
    source = "../.."
}
