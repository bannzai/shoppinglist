name: firebase-deploy

# GitHub Actions から Firebase Functions(gen2) を手動デプロイするワークフロー。
#
# 方針:
# - プロジェクト規約「Deploy はユーザーが行う」に従い、push による自動デプロイはせず
#   workflow_dispatch（手動実行）のみをトリガーとする。
# - 認証はデプロイ専用サービスアカウントの鍵(JSON)を base64 化した GitHub Secret を
#   Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS) として復元して行う。
# - 対象プロジェクトは入力 project(dev/prod) で選択し、--project で .firebaserc の alias を指定する(Issue #410 / ADR 0030)。
# - dev/prod の切替は GitHub Environments で行う。同名 Secret FIREBASE_SERVICE_ACCOUNT_BASE64 を
#   environment(dev/prod)単位で出し分ける(_DEV/_PROD のような名前分けはしない)。
#
# 事前準備(初回のみ):
# 1. dev/prod それぞれにデプロイ専用 SA を用意し gen2 デプロイに必要な IAM 権限を付与する。
#    → firebase-functions-deploy-iam-setup スキルで診断・付与できる。
#      既定 SA: github-firebase-deployer@<projectId>.iam.gserviceaccount.com
# 2. GitHub の Environments(dev / prod)を作成し、各 environment の Secret として
#    FIREBASE_SERVICE_ACCOUNT_BASE64(その project の SA 鍵 JSON を base64 化)を登録する。
#      例: base64 -i service-account.json | pbcopy   # macOS
# 3. APP_ENV は deploy 対象 project(dev/prod) から導出するため Variable は不要(.env.<projectId> を CI で生成)。

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'デプロイ先プロジェクト'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      functions:
        description: 'デプロイする関数名(カンマ区切り。例: functions:createGroup,functions:acceptGroupInvitation)。deploy_all=true のときは無視'
        required: false
        type: string
      deploy_all:
        description: '全関数をデプロイする'
        required: false
        type: boolean
        default: false

# 半端な状態を避けるため、デプロイは同時に1本だけ実行する(実行中はキャンセルせず待機させる)。
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

# リポジトリの読み取りのみ。デプロイ認証は SA 鍵で行うため書き込み権限は不要。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # dev/prod の Secret(FIREBASE_SERVICE_ACCOUNT_BASE64)を environment 単位で出し分ける。
    environment: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # firebase/functions/package.json の engines.node に合わせる
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Resolve project
        id: resolve
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "$PROJECT" = "prod" ]; then
            echo "project_id=shoppinglist-prod-857bb" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=shoppinglist-dev-b2787" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore service account key
        env:
          # environment(dev/prod)単位で値が出し分けられる同名 Secret。
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_BASE64 が未設定です(GitHub Environment '${{ inputs.project }}' に登録してください)"
            exit 1
          fi
          # Functions の source(firebase/functions)の外に置く。source 内に置くと firebase deploy が
          # 関数のソースと一緒に鍵をアップロードするため(Issue #675)。
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/GOOGLE_APPLICATION_CREDENTIALS.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/GOOGLE_APPLICATION_CREDENTIALS.json" >> "$GITHUB_ENV"

      - name: Restore functions env (APP_ENV)
        working-directory: firebase/functions
        env:
          PROJECT: ${{ inputs.project }}
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
        run: |
          # firebase-functions params(defineString "APP_ENV") が参照する project 別 dotenv を生成する。
          # APP_ENV は deploy 対象(dev/prod)そのもの。.env.* は .gitignore 対象で CI には存在しない。
          printf 'APP_ENV=%s\n' "$PROJECT" > ".env.${PROJECT_ID}"

      - name: Deploy functions
        working-directory: firebase
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          DEPLOY_FUNCTIONS: ${{ inputs.functions }}
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
        # --project で .firebaserc の alias(dev/prod)を明示。firebase.json の predeploy で lint + build。
        run: |
          if [ "$DEPLOY_ALL" = "true" ]; then
            firebase deploy --only functions --project "$PROJECT_ID"
          elif [ -n "$DEPLOY_FUNCTIONS" ]; then
            firebase deploy --only "$DEPLOY_FUNCTIONS" --project "$PROJECT_ID"
          else
            echo "::error::deploy_all=false のときは functions に対象(例: functions:createGroup)を指定してください"
            exit 1
          fi
