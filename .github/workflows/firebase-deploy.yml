name: firebase-deploy

# GitHub Actions から Firebase Functions(gen2) を手動デプロイするワークフロー。
#
# 方針:
# - プロジェクト規約「Deploy はユーザーが行う」に従い、push による自動デプロイはせず
#   workflow_dispatch（手動実行）のみをトリガーとする。
# - 認証は Workload Identity Federation で行い、GitHub の OIDC トークンをデプロイ専用 SA
#   github-firebase-deployer@<projectId>.iam.gserviceaccount.com の短命な access token に交換する
#   (長期の SA 鍵は持たない。Issue #694)。
# - 対象プロジェクトは入力 project(dev/prod) で選択し、--project で .firebaserc の alias を指定する(Issue #410 / ADR 0030)。
# - job は GitHub Environment(dev/prod)で動かす。Workload Identity Provider は OIDC トークンの
#   environment claim で絞っており、dev の job から prod の SA は借りられない。
#
# 事前準備(初回のみ):
# 1. dev/prod それぞれにデプロイ専用 SA を用意し gen2 デプロイに必要な IAM 権限を付与する。
#    → firebase-functions-deploy-iam-setup スキルで診断・付与できる。
# 2. Workload Identity Pool / Provider と SA への binding を作る(冪等):
#      bash scripts/setup-github-actions-wif.sh   # owner の認証情報で実行する
# 3. GitHub の Environments(dev / prod)を作成する。Secret の登録は不要。
# 4. APP_ENV は deploy 対象 project(dev/prod) から導出するため Variable は不要(.env.<projectId> を CI で生成)。

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'デプロイ先プロジェクト'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      functions:
        description: 'デプロイする関数名(カンマ区切り。例: functions:createGroup,functions:acceptGroupInvitation)。deploy_all=true のときは無視'
        required: false
        type: string
      deploy_all:
        description: '全関数をデプロイする'
        required: false
        type: boolean
        default: false
      force:
        description: 'firebase deploy に --force を付ける。retry (failure policy) を有効にした関数を初めて出す時など、CLI が確認を求めて止まる時に使う。deploy_all と併用するとソースに無い関数も確認なしで削除する'
        required: false
        type: boolean
        default: false

# 半端な状態を避けるため、デプロイは同時に1本だけ実行する(実行中はキャンセルせず待機させる)。
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

# id-token は Workload Identity Federation の OIDC トークン発行に要る。
permissions:
  contents: read
  id-token: write

env:
  # latest だと CLI の更新で挙動が変わりデプロイが再現しなくなるため固定する。
  # 15.22.2 は external_account 資格情報(WIF)を ADC として読めない回帰があり、15.22.3 で修正済み。
  FIREBASE_TOOLS_VERSION: '15.32.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC トークンの environment claim(dev/prod)を Workload Identity Provider の条件に使う。
    environment: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # firebase/functions/package.json の engines.node に合わせる
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      # id-token: write は job 全体に効き、依存の lifecycle script (preinstall / install / postinstall) も
      # OIDC トークンを取得できるため、インストール時の script は実行しない。
      # predeploy (lint・build) と関数の検出は script 無しで入れた依存で動く。
      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci --ignore-scripts

      - name: Install firebase-tools
        run: npm install -g --ignore-scripts "firebase-tools@${FIREBASE_TOOLS_VERSION}"

      - name: Resolve project
        id: resolve
        env:
          PROJECT: ${{ inputs.project }}
        # project_number は Workload Identity Pool のリソース名に要る(scripts/setup-github-actions-wif.sh)。
        run: |
          if [ "$PROJECT" = "prod" ]; then
            echo "project_id=shoppinglist-prod-857bb" >> "$GITHUB_OUTPUT"
            echo "project_number=323773689605" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=shoppinglist-dev-b2787" >> "$GITHUB_OUTPUT"
            echo "project_number=764733922439" >> "$GITHUB_OUTPUT"
          fi

      # 依存のコードは firebase deploy の predeploy (lint・build) と関数の検出でもこの job 内で動き、
      # OIDC トークンを取得できる。step の順序はこれへの防御にはならない。
      # 資格情報ファイル(gha-creds-*.json)は $GITHUB_WORKSPACE 直下に作られ、Functions の source(firebase/functions)の
      # 外なのでデプロイの成果物に含まれない(Issue #675)。ファイルは post step が削除する。
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.resolve.outputs.project_id }}
          workload_identity_provider: projects/${{ steps.resolve.outputs.project_number }}/locations/global/workloadIdentityPools/github/providers/shoppinglist
          service_account: github-firebase-deployer@${{ steps.resolve.outputs.project_id }}.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Restore functions env (APP_ENV)
        working-directory: firebase/functions
        env:
          PROJECT: ${{ inputs.project }}
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
        run: |
          # firebase-functions params(defineString "APP_ENV") が参照する project 別 dotenv を生成する。
          # APP_ENV は deploy 対象(dev/prod)そのもの。.env.* は .gitignore 対象で CI には存在しない。
          printf 'APP_ENV=%s\n' "$PROJECT" > ".env.${PROJECT_ID}"

      - name: Deploy functions
        working-directory: firebase
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          DEPLOY_FUNCTIONS: ${{ inputs.functions }}
          DEPLOY_FORCE: ${{ inputs.force }}
          PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
        # --project で .firebaserc の alias(dev/prod)を明示。firebase.json の predeploy で lint + build。
        # CI では確認に答えられないため、確認を求める変更 (failure policy の追加等) は force=true で通す。
        run: |
          FORCE_OPTION=()
          if [ "$DEPLOY_FORCE" = "true" ]; then
            FORCE_OPTION=(--force)
          fi
          if [ "$DEPLOY_ALL" = "true" ]; then
            firebase deploy --only functions --project "$PROJECT_ID" "${FORCE_OPTION[@]}"
          elif [ -n "$DEPLOY_FUNCTIONS" ]; then
            firebase deploy --only "$DEPLOY_FUNCTIONS" --project "$PROJECT_ID" "${FORCE_OPTION[@]}"
          else
            echo "::error::deploy_all=false のときは functions に対象(例: functions:createGroup)を指定してください"
            exit 1
          fi
